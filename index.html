<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>とびだすえほん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3; --ink:#18202c; --muted:#5a6575; --panel:#f8f9fb; --line:#cdd3dc;
  --accent:#0f7f86; --accent-ink:#ffffff; --deep:#0b0f17;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141922; --ink:#e7ebf1; --muted:#9aa5b5; --panel:#1d2430; --line:#323c4b;
    --accent:#5cc6cb; --accent-ink:#06282a; --deep:#05070b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141922; --ink:#e7ebf1; --muted:#9aa5b5; --panel:#1d2430; --line:#323c4b;
  --accent:#5cc6cb; --accent-ink:#06282a; --deep:#05070b; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;font-weight:500;font-size:15px;line-height:1.6}
header{max-width:1180px;margin:0 auto;padding:20px 20px 0}
h1{margin:0;font-weight:900;font-size:clamp(26px,5vw,36px);line-height:1.2}
header p{margin:4px 0 0;color:var(--muted)}
.layout{display:grid;grid-template-columns:1fr;gap:20px;max-width:1180px;margin:0 auto;padding:16px 20px 32px}
@media (min-width:880px){.layout{grid-template-columns:1fr 300px;align-items:start}}
.stage{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.win{position:relative;max-width:100%;border-radius:18px;overflow:hidden;background:var(--deep);box-shadow:0 0 0 6px var(--deep),0 24px 50px -24px rgba(0,0,0,.6)}
.win canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.win.dragover{outline:3px dashed var(--accent);outline-offset:10px}
.rec{position:absolute;top:12px;left:12px;background:rgba(200,30,40,.9);color:#fff;font-size:13px;padding:2px 10px;border-radius:12px}
.hint{margin:0;color:var(--muted);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:18px}
.group h2{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:900}
.file-btn{display:block;text-align:center;padding:12px;border:2px dashed var(--line);border-radius:10px;cursor:pointer;font-weight:900}
.file-btn:hover,.file-btn:focus-within{border-color:var(--accent);color:var(--accent)}
.file-btn input{position:absolute;opacity:0;width:1px;height:1px}
.status{font-size:13px;color:var(--muted);margin:-6px 0 0;min-height:1.6em}
.status.warn{color:var(--ink)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;margin-bottom:10px}
.row label{font-size:14px}
.row output{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:8px}
.check input{accent-color:var(--accent);width:18px;height:18px}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1}
.btn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:900;width:100%;padding:12px}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.show{opacity:1}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.seg{flex-wrap:wrap}
.seg button{min-width:56px;padding:8px 6px}
.btn.sub{width:100%}
</style>
</head>
<body>
<header>
  <h1>とびだすえほん</h1>
  <p>イラストを奥行きで何枚かの層に切り分けて、飛び出す絵本にします。</p>
</header>
<main class="layout">
  <section class="stage">
    <div class="win" id="win"><canvas id="view" aria-label="飛び出す絵本の表示"></canvas><div class="rec" id="rec" hidden>録画中</div></div>
    <p class="hint">絵の上でカーソルを動かすか、指でなぞると回り込めます</p>
  </section>
  <aside class="panel">
    <label class="file-btn">画像をえらぶ（ドロップも可）<input type="file" id="file" accept="image/*"></label>
    <p class="status" id="status" role="status"></p>

    <div class="group">
      <h2>層</h2>
      <div class="row"><label for="pLayers">層の数</label><output id="oLayers"></output><input type="range" id="pLayers" min="2" max="8" step="1" value="5"></div>
      <div class="row"><label for="pDepth">層の間隔</label><output id="oDepth"></output><input type="range" id="pDepth" min="0.1" max="1.2" step="0.02" value="0.5"></div>
      <div class="row"><label for="pRim">白いふち</label><output id="oRim"></output><input type="range" id="pRim" min="0" max="6" step="1" value="2"></div>
      <div class="row"><label for="pAngle">回り込みの範囲</label><output id="oAngle"></output><input type="range" id="pAngle" min="5" max="45" step="1" value="30"></div>
      <button class="btn sub" id="reopen">もう一度ひらく</button>
    </div>

    <div class="group">
      <h2>演出</h2>
      <div class="row"><label for="pBlur">ぼかし</label><output id="oBlur"></output><input type="range" id="pBlur" min="0" max="1" step="0.05" value="0"></div>
      <div class="row"><label for="pFocus">ピントの位置（奥〜手前）</label><output id="oFocus"></output><input type="range" id="pFocus" min="0" max="1" step="0.05" value="1"></div>
      <div class="seg" role="radiogroup" aria-label="パーティクル" id="pSeg">
        <button class="btn" data-p="none" aria-pressed="true">なし</button>
        <button class="btn" data-p="sakura" aria-pressed="false">桜</button>
        <button class="btn" data-p="snow" aria-pressed="false">雪</button>
        <button class="btn" data-p="confetti" aria-pressed="false">紙吹雪</button>
        <button class="btn" data-p="kira" aria-pressed="false">きらきら</button>
      </div>
      <div class="row"><label for="pAmount">パーティクルの量</label><output id="oAmount"></output><input type="range" id="pAmount" min="20" max="600" step="10" value="200"></div>
    </div>

    <div class="group">
      <h2>操作</h2>
      <label class="check"><input type="checkbox" id="auto" checked>触っていないときは自動でゆらす</label>
      <button class="btn" id="gyro" hidden>スマホの傾きで動かす</button>
    </div>

    <div class="group">
      <h2>動画</h2>
      <div class="seg" role="group" aria-label="動画の動き" id="mSeg">
        <button class="btn" data-m="open" aria-pressed="true">ひらく</button>
        <button class="btn" data-m="sway" aria-pressed="false">ゆらゆら</button>
      </div>
      <div class="seg" role="group" aria-label="動画の長さ" id="lSeg">
        <button class="btn" data-sec="3" aria-pressed="false">3秒</button>
        <button class="btn" data-sec="5" aria-pressed="true">5秒</button>
        <button class="btn" data-sec="8" aria-pressed="false">8秒</button>
      </div>
      <button class="btn primary" id="recBtn">動画を書き出す</button>
    </div>
  </aside>
</main>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const canvas = $('#view'), win = $('#win');
const WORK = 512, FULL = 1600, FOV = 30, ZOOM = 1.0;
const DIST = 0.5 / Math.tan(THREE.MathUtils.degToRad(FOV/2));
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setClearColor(0x0b0f17, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.01, 30);
const group = new THREE.Group(); scene.add(group);
const P = {layers:5, depth:0.5, rim:2, angle:30, blur:0, focus:1, particle:'none', amount:200};
let aspect = 1, title = '', work = null, loadToken = 0;
function status(msg, warn){ const s=$('#status'); s.textContent = msg; s.classList.toggle('warn', !!warn); }
let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600); }
function scaledCanvas(src, maxSide, flatten){
  const w0 = src.naturalWidth || src.width, h0 = src.naturalHeight || src.height;
  const s = Math.min(1, maxSide / Math.max(w0, h0));
  const c = document.createElement('canvas'); c.width = Math.max(2, Math.round(w0*s)); c.height = Math.max(2, Math.round(h0*s));
  const g = c.getContext('2d');
  if (flatten){ g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height); }
  g.drawImage(src, 0, 0, c.width, c.height);
  return c;
}
function normalize(d){
  const n = d.length, step = Math.max(1, Math.floor(n/20000)), samp = [];
  for (let i=0;i<n;i+=step) samp.push(d[i]);
  samp.sort((a,b)=>a-b);
  const lo = samp[Math.floor(samp.length*0.02)], hi = samp[Math.floor(samp.length*0.98)];
  const r = Math.max(1e-6, hi-lo), out = new Float32Array(n);
  for (let i=0;i<n;i++) out[i] = Math.min(1, Math.max(0, (d[i]-lo)/r));
  return out;
}
function resample(src, sw, sh, ch, dw, dh){
  const out = new Float32Array(dw*dh);
  for (let y=0;y<dh;y++){ const fy = (y+0.5)*sh/dh-0.5, y0 = Math.max(0,Math.floor(fy)), y1 = Math.min(sh-1,y0+1), ty = Math.min(1,Math.max(0,fy-y0));
    for (let x=0;x<dw;x++){ const fx = (x+0.5)*sw/dw-0.5, x0 = Math.max(0,Math.floor(fx)), x1 = Math.min(sw-1,x0+1), tx = Math.min(1,Math.max(0,fx-x0));
      const a = src[(y0*sw+x0)*ch], b = src[(y0*sw+x1)*ch], c = src[(y1*sw+x0)*ch], d = src[(y1*sw+x1)*ch];
      out[y*dw+x] = (a*(1-tx)+b*tx)*(1-ty) + (c*(1-tx)+d*tx)*ty; } }
  return out;
}
function boxBlur(a, w, h, r){
  const tmp = new Float32Array(a.length), out = new Float32Array(a.length);
  for (let y=0;y<h;y++){ let s=0; for (let x=-r;x<=r;x++) s += a[y*w+Math.min(w-1,Math.max(0,x))];
    for (let x=0;x<w;x++){ tmp[y*w+x] = s/(2*r+1); s += a[y*w+Math.min(w-1,x+r+1)] - a[y*w+Math.max(0,x-r)]; } }
  for (let x=0;x<w;x++){ let s=0; for (let y=-r;y<=r;y++) s += tmp[Math.min(h-1,Math.max(0,y))*w+x];
    for (let y=0;y<h;y++){ out[y*w+x] = s/(2*r+1); s += tmp[Math.min(h-1,y+r+1)*w+x] - tmp[Math.max(0,y-r)*w+x]; } }
  return out;
}
function minFilter(a, w, h, r){
  const tmp = new Float32Array(a.length), out = new Float32Array(a.length);
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){ let m=1e9; const x0=Math.max(0,x-r), x1=Math.min(w-1,x+r);
    for (let k=x0;k<=x1;k++){ const v=a[y*w+k]; if (v<m) m=v; } tmp[y*w+x]=m; }
  for (let x=0;x<w;x++) for (let y=0;y<h;y++){ let m=1e9; const y0=Math.max(0,y-r), y1=Math.min(h-1,y+r);
    for (let k=y0;k<=y1;k++){ const v=tmp[k*w+x]; if (v<m) m=v; } out[y*w+x]=m; }
  return out;
}
function dilate(m, w, h, r){
  const out = new Uint8Array(m.length);
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){ if (!m[y*w+x]) continue;
    for (let dy=-r;dy<=r;dy++) for (let dx=-r;dx<=r;dx++){ const xx=x+dx, yy=y+dy; if (xx>=0&&yy>=0&&xx<w&&yy<h) out[yy*w+xx]=1; } }
  return out;
}
// 穴埋め（push-pull）：色と奥行きを周りから補う
function pushPull(rgba, d, mask, w, h){
  const levels = [];
  let Pv = new Float32Array(w*h*4), Wv = new Float32Array(w*h);
  for (let i=0;i<w*h;i++) if (!mask[i]){ Wv[i]=1; Pv[i*4]=rgba[i*4]; Pv[i*4+1]=rgba[i*4+1]; Pv[i*4+2]=rgba[i*4+2]; Pv[i*4+3]=d[i]; }
  levels.push({w,h,P:Pv,W:Wv});
  let cw=w, ch=h;
  while (cw>1 || ch>1){
    const nw=Math.max(1,Math.ceil(cw/2)), nh=Math.max(1,Math.ceil(ch/2));
    const L=levels[levels.length-1], nP=new Float32Array(nw*nh*4), nW=new Float32Array(nw*nh);
    for (let y=0;y<nh;y++) for (let x=0;x<nw;x++){
      let sw=0, s0=0,s1=0,s2=0,s3=0;
      for (let dy=0;dy<2;dy++) for (let dx=0;dx<2;dx++){ const sx=Math.min(cw-1,2*x+dx), sy=Math.min(ch-1,2*y+dy), j=sy*cw+sx;
        sw+=L.W[j]; s0+=L.P[j*4]; s1+=L.P[j*4+1]; s2+=L.P[j*4+2]; s3+=L.P[j*4+3]; }
      const i=y*nw+x;
      if (sw>0){ const a=Math.min(1,sw); nW[i]=a; nP[i*4]=s0/sw*a; nP[i*4+1]=s1/sw*a; nP[i*4+2]=s2/sw*a; nP[i*4+3]=s3/sw*a; }
    }
    levels.push({w:nw,h:nh,P:nP,W:nW}); cw=nw; ch=nh;
  }
  const top = levels[levels.length-1];
  if (top.W[0] < 1){ const a=top.W[0]; for (let k=0;k<4;k++) top.P[k] = a>0 ? top.P[k]/a : (k<3?200:0); top.W[0]=1; }
  for (let l=levels.length-2;l>=0;l--){
    const L=levels[l], Up=levels[l+1];
    for (let y=0;y<L.h;y++) for (let x=0;x<L.w;x++){
      const i=y*L.w+x, a=L.W[i]; if (a>=1) continue;
      const fx=Math.min(Up.w-1,Math.max(0,(x+0.5)/2-0.5)), fy=Math.min(Up.h-1,Math.max(0,(y+0.5)/2-0.5));
      const x0=Math.floor(fx), y0=Math.floor(fy), x1=Math.min(Up.w-1,x0+1), y1=Math.min(Up.h-1,y0+1), tx=fx-x0, ty=fy-y0;
      for (let k=0;k<4;k++){
        const v=(Up.P[(y0*Up.w+x0)*4+k]*(1-tx)+Up.P[(y0*Up.w+x1)*4+k]*tx)*(1-ty)+(Up.P[(y1*Up.w+x0)*4+k]*(1-tx)+Up.P[(y1*Up.w+x1)*4+k]*tx)*ty;
        L.P[i*4+k] = L.P[i*4+k] + v*(1-a);
      }
      L.W[i]=1;
    }
  }
  const out = new Uint8ClampedArray(w*h*4), od = new Float32Array(w*h);
  for (let i=0;i<w*h;i++){ out[i*4]=levels[0].P[i*4]; out[i*4+1]=levels[0].P[i*4+1]; out[i*4+2]=levels[0].P[i*4+2]; out[i*4+3]=255; od[i]=levels[0].P[i*4+3]; }
  return {rgba:out, d:od};
}

// ---------- 奥行き推定 ----------
function pseudoDepth(rgba, w, h){
  let hasAlpha = false;
  for (let i=3;i<rgba.length;i+=16) if (rgba[i] < 250){ hasAlpha = true; break; }
  const fg = new Float32Array(w*h);
  if (hasAlpha){ for (let i=0;i<w*h;i++) fg[i] = rgba[i*4+3]/255; }
  else {
    let r=0,g=0,b=0,n=0;
    const add = i => { r+=rgba[i*4]; g+=rgba[i*4+1]; b+=rgba[i*4+2]; n++; };
    for (let x=0;x<w;x++){ add(x); add((h-1)*w+x); } for (let y=0;y<h;y++){ add(y*w); add(y*w+w-1); }
    r/=n; g/=n; b/=n;
    for (let i=0;i<w*h;i++){ const dr=rgba[i*4]-r, dg=rgba[i*4+1]-g, db=rgba[i*4+2]-b;
      fg[i] = Math.min(1, Math.sqrt(dr*dr+dg*dg+db*db)/90); }
  }
  const fb = boxBlur(boxBlur(fg,w,h,4),w,h,4), d = new Float32Array(w*h);
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){ const i=y*w+x; d[i] = 0.3*(y/(h-1)) + 0.7*Math.min(1, fb[i]*1.3); }
  return normalize(d);
}
let depthPipe = null;
async function aiDepth(cv, onProg){
  if (!depthPipe){
    const T = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.6');
    T.env.allowLocalModels = false;
    const files = {};
    const opts = device => ({device, progress_callback: e => {
      if (e.status === 'progress' && e.total){ files[e.file] = [e.loaded, e.total];
        let l=0, t=0; for (const k in files){ l+=files[k][0]; t+=files[k][1]; } onProg(Math.round(l/t*100)); } }});
    try { depthPipe = await T.pipeline('depth-estimation', 'onnx-community/depth-anything-v2-small', opts(navigator.gpu ? 'webgpu' : 'wasm')); }
    catch (e) { if (!navigator.gpu) throw e; depthPipe = await T.pipeline('depth-estimation', 'onnx-community/depth-anything-v2-small', opts('wasm')); }
  }
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  const url = URL.createObjectURL(blob);
  try {
    const out = await depthPipe(url);
    const di = out.depth;
    return normalize(resample(di.data, di.width, di.height, di.channels || 1, cv.width, cv.height));
  } finally { URL.revokeObjectURL(url); }
}

// ---------- 層まわりの処理 ----------
function boxDilate(m, w, h, r){
  const tmp = new Uint8Array(m.length), out = new Uint8Array(m.length);
  for (let y=0;y<h;y++){ let last=-1e9;
    for (let x=0;x<w;x++){ if (m[y*w+x]) last=x; }
    for (let x=0;x<w;x++){ let v=0; const x0=Math.max(0,x-r), x1=Math.min(w-1,x+r); for (let k=x0;k<=x1;k++) if (m[y*w+k]){ v=1; break; } tmp[y*w+x]=v; } }
  for (let x=0;x<w;x++) for (let y=0;y<h;y++){ let v=0; const y0=Math.max(0,y-r), y1=Math.min(h-1,y+r); for (let k=y0;k<=y1;k++) if (tmp[k*w+x]){ v=1; break; } out[y*w+x]=v; }
  return out;
}
function kmeansLabels(d, w, h, n){
  const sorted = Array.from(d).filter((_,i)=>i%7===0).sort((a,b)=>a-b);
  let c = []; for (let k=0;k<n;k++) c.push(sorted[Math.floor((k+0.5)/n*(sorted.length-1))]);
  const lab = new Uint8Array(w*h);
  for (let it=0; it<12; it++){
    const sum = new Float64Array(n), cnt = new Float64Array(n);
    for (let i=0;i<w*h;i++){ let bi=0, bd=1e9; for (let k=0;k<n;k++){ const e=Math.abs(d[i]-c[k]); if (e<bd){ bd=e; bi=k; } } lab[i]=bi; sum[bi]+=d[i]; cnt[bi]++; }
    for (let k=0;k<n;k++) if (cnt[k]) c[k]=sum[k]/cnt[k];
    const order = c.map((v,i)=>[v,i]).sort((a,b)=>a[0]-b[0]); c = order.map(o=>o[0]);
  }
  for (let i=0;i<w*h;i++){ let bi=0, bd=1e9; for (let k=0;k<n;k++){ const e=Math.abs(d[i]-c[k]); if (e<bd){ bd=e; bi=k; } } lab[i]=bi; }
  // 多数決でゴミを掃除
  for (let pass=0; pass<2; pass++){
    const src = lab.slice();
    const cnt = new Uint8Array(n);
    for (let y=0;y<h;y++) for (let x=0;x<w;x++){
      cnt.fill(0);
      for (let dy=-2;dy<=2;dy++) for (let dx=-2;dx<=2;dx++){ const xx=Math.min(w-1,Math.max(0,x+dx)), yy=Math.min(h-1,Math.max(0,y+dy)); cnt[src[yy*w+xx]]++; }

function makeLayers(){
  const {w, h, rgba, d, full} = work;

const cardVS = `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;
const cardFS = `
uniform sampler2D map; uniform vec2 texel; uniform float blur; uniform float shadow; uniform float opacity; varying vec2 vUv;
void main(){
  vec4 acc=vec4(0.);
  if(blur<0.5){ vec4 c=texture2D(map,vUv); acc=vec4(c.rgb*c.a,c.a); }
  else { for(int i=0;i<16;i++){ float fi=float(i); float r=sqrt((fi+0.5)/16.)*blur; float a=fi*2.39996;
    vec4 c=texture2D(map,vUv+vec2(cos(a),sin(a))*r*texel); acc+=vec4(c.rgb*c.a,c.a); } acc/=16.; }
  if(acc.a<0.05) discard;
  if(shadow>0.5){ gl_FragColor=vec4(0.,0.,0.,acc.a*opacity); return; }
  gl_FragColor=vec4(acc.rgb/max(acc.a,1e-4),acc.a);
}`;

  return new THREE.ShaderMaterial({vertexShader:cardVS, fragmentShader:cardFS, transparent:true, depthWrite:!shadow, side:THREE.DoubleSide,
    uniforms:{map:{value:texture}, texel:{value:new THREE.Vector2(1/texture.image.width,1/texture.image.height)}, blur:{value:shadow?6:0}, shadow:{value:shadow?1:0}, opacity:{value:0.35}}});
}
let cards = [];
function clearCards(){
  cards.forEach(c => { group.remove(c.pivot); c.mesh.geometry.dispose(); c.mesh.material.dispose(); c.tex.dispose(); if (c.shadow) c.shadow.material.dispose(); });
  cards = [];
}
function buildScene(){
  if (!work) return;
  clearCards();
  const layers = makeLayers();
  layers.forEach((cv, i) => {
    const t = new THREE.CanvasTexture(cv); t.minFilter=THREE.LinearFilter; t.generateMipmaps=false; t.anisotropy=4;
    const geo = new THREE.PlaneGeometry(aspect, 1);
    const mesh = new THREE.Mesh(geo, cardMat(t, false)); mesh.renderOrder = i*2;
    const pivot = new THREE.Group(); pivot.add(mesh);
    let shadow = null;
    if (i>0){ shadow = new THREE.Mesh(geo, cardMat(t, true)); shadow.renderOrder = i*2-1; pivot.add(shadow); }
    group.add(pivot);
    cards.push({pivot, mesh, shadow, tex:t, index:i, count:layers.length});
  });

}
function cardZ(i, n){ return n<=1 ? 0 : (i/(n-1) - 0.5) * P.depth; }
function placeCards(){
  const dist = DIST/ZOOM;
  cards.forEach(c => {
    const z = cardZ(c.index, c.count), s = (dist - z)/dist;
    c.s = s;
    c.pivot.position.set(0, -0.5*s, z);
    c.mesh.scale.set(s, s, 1); c.mesh.position.set(0, 0.5*s, 0);
    if (c.shadow){ const gap = P.depth/Math.max(1,c.count-1);
      c.shadow.scale.set(s, s, 1); c.shadow.position.set(0.012*s, 0.5*s-0.014*s, -Math.min(0.03, gap*0.5)); }

}
function applyBlur(){
  cards.forEach(c => {

const OPEN_MS = 2200;
let openStart = -1e9;
function easeOutBack(t){ const c1=1.4, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); }
function openAngle(i, n, now){

  const t = Math.min(1, Math.max(0, (p - delay)/span));

}

function spriteTex(kind){
  const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d');
  if (kind==='sakura'){ g.fillStyle='#ffc6d6'; g.beginPath(); g.ellipse(32,32,14,24,0.5,0,7); g.fill(); g.fillStyle='#ff9fbb'; g.beginPath(); g.ellipse(32,32,5,14,0.5,0,7); g.fill(); }
  else if (kind==='snow'){ const gr=g.createRadialGradient(32,32,0,32,32,30); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.5,'rgba(255,255,255,.8)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,64,64); }
  else if (kind==='kira'){ const gr=g.createRadialGradient(32,32,0,32,32,12); gr.addColorStop(0,'rgba(255,255,230,1)'); gr.addColorStop(1,'rgba(255,240,180,0)'); g.fillStyle=gr; g.fillRect(0,0,64,64);

let particles = null;
function buildParticles(){
  if (particles){ group.remove(particles.points); particles.points.geometry.dispose(); particles.points.material.map.dispose(); particles.points.material.dispose(); particles = null; }
  if (P.particle === 'none') return;
  const n = Math.round(P.amount), pos = new Float32Array(n*3), col = new Float32Array(n*3), meta = [];
  const pal = [[1,.42,.5],[1,.82,.4],[.45,.75,1],[.6,.9,.55],[1,1,1],[.85,.6,1]];
  for (let i=0;i<n;i++){
    meta.push({ph:Math.random()*6.28, sp:0.5+Math.random(), sx:0.3+Math.random()*0.7});
    resetP(pos, i, true);
    const cc = P.particle==='confetti' ? pal[i%pal.length] : [1,1,1]; col.set(cc, i*3);
  }
  const g = new THREE.BufferGeometry();

  pos[i*3+1] = anyY ? Math.random()*1.3-0.65 : (P.particle==='kira' ? -0.65 : 0.65);

}

  if (!particles) return;
  const pos = particles.points.geometry.attributes.position.array, k = P.particle;

    const m = particles.meta[i];
    if (k==='kira'){ pos[i*3+1] += dt*0.04*m.sp; pos[i*3] += Math.sin(t*0.7+m.ph)*dt*0.01; if (pos[i*3+1]>0.65) resetP(pos,i,false); }

async function load(src, name, presetDepthCanvas){

  aspect = full.width / full.height;
  const w = wc.width, h = wc.height, rgba = wc.getContext('2d').getImageData(0,0,w,h).data;
  layout();
  if (presetDepthCanvas){
    const dc = scaledCanvas(presetDepthCanvas, WORK, true), dd = dc.getContext('2d').getImageData(0,0,dc.width,dc.height).data;
    work = {w, h, rgba, full, d: normalize(resample(dd, dc.width, dc.height, 4, w, h))};
    rebuild(); openStart = performance.now();
    status('見本は奥行きデータ付きです。自分の画像はAIで奥行きを推定します。');

  }
  clearCards();
  work = {w, h, rgba, full, d: pseudoDepth(raw.getContext('2d').getImageData(0,0,w,h).data, w, h)};
  status('AIで奥行きを推定しています…');
  try {
    const d = await aiDepth(wc, p => { if (token===loadToken) status(`AIモデルを読み込み中… ${p}%（初回のみ）`); });
    if (token !== loadToken) return;
    work.d = boxBlur(d, w, h, 1); rebuild(); openStart = performance.now(); status('AIで推定した奥行きで表示中');

}
