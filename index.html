<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>とびだすえほん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3; --ink:#18202c; --muted:#5a6575; --panel:#f8f9fb; --line:#cdd3dc;
  --accent:#0f7f86; --accent-ink:#ffffff; --deep:#0b0f17;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141922; --ink:#e7ebf1; --muted:#9aa5b5; --panel:#1d2430; --line:#323c4b;
    --accent:#5cc6cb; --accent-ink:#06282a; --deep:#05070b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141922; --ink:#e7ebf1; --muted:#9aa5b5; --panel:#1d2430; --line:#323c4b;
  --accent:#5cc6cb; --accent-ink:#06282a; --deep:#05070b; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;font-weight:500;font-size:15px;line-height:1.6}
header{max-width:1180px;margin:0 auto;padding:20px 20px 0}
h1{margin:0;font-weight:900;font-size:clamp(26px,5vw,36px);line-height:1.2}
header p{margin:4px 0 0;color:var(--muted)}
.layout{display:grid;grid-template-columns:1fr;gap:20px;max-width:1180px;margin:0 auto;padding:16px 20px 32px}
@media (min-width:880px){.layout{grid-template-columns:1fr 300px;align-items:start}}
.stage{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.win{position:relative;max-width:100%;border-radius:18px;overflow:hidden;background:var(--deep);box-shadow:0 0 0 6px var(--deep),0 24px 50px -24px rgba(0,0,0,.6)}
.win canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.win.dragover{outline:3px dashed var(--accent);outline-offset:10px}
.rec{position:absolute;top:12px;left:12px;background:rgba(200,30,40,.9);color:#fff;font-size:13px;padding:2px 10px;border-radius:12px}
.hint{margin:0;color:var(--muted);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:18px}
.group h2{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:900}
.file-btn{display:block;text-align:center;padding:12px;border:2px dashed var(--line);border-radius:10px;cursor:pointer;font-weight:900}
.file-btn:hover,.file-btn:focus-within{border-color:var(--accent);color:var(--accent)}
.file-btn input{position:absolute;opacity:0;width:1px;height:1px}
.status{font-size:13px;color:var(--muted);margin:-6px 0 0;min-height:1.6em}
.status.warn{color:var(--ink)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;margin-bottom:10px}
.row label{font-size:14px}
.row output{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:8px}
.check input{accent-color:var(--accent);width:18px;height:18px}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1}
.btn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:900;width:100%;padding:12px}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.show{opacity:1}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.seg{flex-wrap:wrap}
.seg button{min-width:56px;padding:8px 6px}
.btn.sub{width:100%}
</style>
</head>
<body>
<header>
  <h1>とびだすえほん</h1>
  <p>キャラを切り抜いて床に立たせ、背景を奥のページにした飛び出す絵本を作ります。</p>
</header>
<main class="layout">
  <section class="stage">
    <div class="win" id="win"><canvas id="view" aria-label="飛び出す絵本の表示"></canvas><div class="rec" id="rec" hidden>録画中</div></div>
    <p class="hint">絵の上でカーソルを動かすか、指でなぞると回り込めます</p>
  </section>
  <aside class="panel">
    <label class="file-btn">画像をえらぶ（ドロップも可）<input type="file" id="file" accept="image/*"></label>
    <p class="status" id="status" role="status"></p>

    <div class="group">
      <h2>立体</h2>
      <div class="row"><label for="pDepth">奥行きの強さ</label><output id="oDepth"></output><input type="range" id="pDepth" min="0.2" max="1.6" step="0.02" value="0.7"></div>
      <div class="row"><label for="pAngle">回り込みの範囲</label><output id="oAngle"></output><input type="range" id="pAngle" min="5" max="45" step="1" value="30"></div>
      <div class="row"><label for="pRim">白いふち</label><output id="oRim"></output><input type="range" id="pRim" min="0" max="6" step="1" value="2"></div>
      <div class="row"><label for="pSplit">くっついたキャラを分ける強さ</label><output id="oSplit"></output><input type="range" id="pSplit" min="0" max="12" step="1" value="4"></div>
      <h2>キャラがいた場所</h2>
      <div class="seg" role="radiogroup" aria-label="キャラがいた場所" id="fSeg">
        <button class="btn" data-f="paper" aria-pressed="true">白い紙</button>
        <button class="btn" data-f="blur" aria-pressed="false">ぼかしで埋める</button>
      </div>
      <button class="btn sub" id="reopen">もう一度ひらく</button>
    </div>

    <div class="group">
      <h2>演出</h2>
      <div class="row"><label for="pBlur">ぼかし</label><output id="oBlur"></output><input type="range" id="pBlur" min="0" max="1" step="0.05" value="0"></div>
      <div class="row"><label for="pFocus">ピントの位置（奥〜手前）</label><output id="oFocus"></output><input type="range" id="pFocus" min="0" max="1" step="0.05" value="1"></div>
      <div class="seg" role="radiogroup" aria-label="パーティクル" id="pSeg">
        <button class="btn" data-p="none" aria-pressed="true">なし</button>
        <button class="btn" data-p="sakura" aria-pressed="false">桜</button>
        <button class="btn" data-p="snow" aria-pressed="false">雪</button>
        <button class="btn" data-p="confetti" aria-pressed="false">紙吹雪</button>
        <button class="btn" data-p="kira" aria-pressed="false">きらきら</button>
      </div>
      <div class="row"><label for="pAmount">パーティクルの量</label><output id="oAmount"></output><input type="range" id="pAmount" min="20" max="600" step="10" value="200"></div>
    </div>

    <div class="group">
      <h2>操作</h2>
      <label class="check"><input type="checkbox" id="auto" checked>触っていないときは自動でゆらす</label>
      <button class="btn" id="gyro" hidden>スマホの傾きで動かす</button>
    </div>

    <div class="group">
      <h2>動画</h2>
      <div class="seg" role="group" aria-label="動画の動き" id="mSeg">
        <button class="btn" data-m="open" aria-pressed="true">ひらく</button>
        <button class="btn" data-m="sway" aria-pressed="false">ゆらゆら</button>
      </div>
      <div class="seg" role="group" aria-label="動画の長さ" id="lSeg">
        <button class="btn" data-sec="3" aria-pressed="false">3秒</button>
        <button class="btn" data-sec="5" aria-pressed="true">5秒</button>
        <button class="btn" data-sec="8" aria-pressed="false">8秒</button>
      </div>
      <button class="btn primary" id="recBtn">動画を書き出す</button>
    </div>
  </aside>
</main>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const canvas = $('#view'), win = $('#win');
const WORK = 512, FULL = 1600, FOV = 30, ZOOM = 1.0;
const DIST = 0.5 / Math.tan(THREE.MathUtils.degToRad(FOV/2));
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setClearColor(0x0b0f17, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.01, 30);
const group = new THREE.Group(); scene.add(group);
const P = {depth:0.7, angle:30, rim:2, split:4, blur:0, focus:1, particle:'none', amount:200, fill:'paper'};
let aspect = 1, title = '', work = null, loadToken = 0;
let paperCache = null;
function paperCanvas(W, H){
  if (paperCache && paperCache.width===W && paperCache.height===H) return paperCache;
  const c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  g.fillStyle='#f2ecdf'; g.fillRect(0,0,W,H);
  for (let i=0;i<W*H/120;i++){ const x=Math.random()*W, y=Math.random()*H, a=Math.random()*6.28, l=2+Math.random()*7;
    g.strokeStyle = Math.random()<0.5 ? 'rgba(120,100,70,.07)' : 'rgba(255,255,255,.35)'; g.lineWidth=1;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*l, y+Math.sin(a)*l); g.stroke(); }
  return paperCache = c;
}
function status(msg, warn){ const s=$('#status'); s.textContent = msg; s.classList.toggle('warn', !!warn); }
let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600); }
function scaledCanvas(src, maxSide, flatten){
  const w0 = src.naturalWidth || src.width, h0 = src.naturalHeight || src.height;
  const s = Math.min(1, maxSide / Math.max(w0, h0));
  const c = document.createElement('canvas'); c.width = Math.max(2, Math.round(w0*s)); c.height = Math.max(2, Math.round(h0*s));
  const g = c.getContext('2d');
  if (flatten){ g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height); }
  g.drawImage(src, 0, 0, c.width, c.height);
  return c;
}
function normalize(d){
  const n = d.length, step = Math.max(1, Math.floor(n/20000)), samp = [];
  for (let i=0;i<n;i+=step) samp.push(d[i]);
  samp.sort((a,b)=>a-b);
  const lo = samp[Math.floor(samp.length*0.02)], hi = samp[Math.floor(samp.length*0.98)];
  const r = Math.max(1e-6, hi-lo), out = new Float32Array(n);
  for (let i=0;i<n;i++) out[i] = Math.min(1, Math.max(0, (d[i]-lo)/r));
  return out;
}
function resample(src, sw, sh, ch, dw, dh){
  const out = new Float32Array(dw*dh);
  for (let y=0;y<dh;y++){ const fy = (y+0.5)*sh/dh-0.5, y0 = Math.max(0,Math.floor(fy)), y1 = Math.min(sh-1,y0+1), ty = Math.min(1,Math.max(0,fy-y0));
    for (let x=0;x<dw;x++){ const fx = (x+0.5)*sw/dw-0.5, x0 = Math.max(0,Math.floor(fx)), x1 = Math.min(sw-1,x0+1), tx = Math.min(1,Math.max(0,fx-x0));
      const a = src[(y0*sw+x0)*ch], b = src[(y0*sw+x1)*ch], c = src[(y1*sw+x0)*ch], d = src[(y1*sw+x1)*ch];
      out[y*dw+x] = (a*(1-tx)+b*tx)*(1-ty) + (c*(1-tx)+d*tx)*ty; } }
  return out;
}
function boxBlur(a, w, h, r){
  const tmp = new Float32Array(a.length), out = new Float32Array(a.length);
  for (let y=0;y<h;y++){ let s=0; for (let x=-r;x<=r;x++) s += a[y*w+Math.min(w-1,Math.max(0,x))];
    for (let x=0;x<w;x++){ tmp[y*w+x] = s/(2*r+1); s += a[y*w+Math.min(w-1,x+r+1)] - a[y*w+Math.max(0,x-r)]; } }
  for (let x=0;x<w;x++){ let s=0; for (let y=-r;y<=r;y++) s += tmp[Math.min(h-1,Math.max(0,y))*w+x];
    for (let y=0;y<h;y++){ out[y*w+x] = s/(2*r+1); s += tmp[Math.min(h-1,y+r+1)*w+x] - tmp[Math.max(0,y-r)*w+x]; } }
  return out;
}
function minFilter(a, w, h, r){
  const tmp = new Float32Array(a.length), out = new Float32Array(a.length);
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){ let m=1e9; const x0=Math.max(0,x-r), x1=Math.min(w-1,x+r);
    for (let k=x0;k<=x1;k++){ const v=a[y*w+k]; if (v<m) m=v; } tmp[y*w+x]=m; }
  for (let x=0;x<w;x++) for (let y=0;y<h;y++){ let m=1e9; const y0=Math.max(0,y-r), y1=Math.min(h-1,y+r);
    for (let k=y0;k<=y1;k++){ const v=tmp[k*w+x]; if (v<m) m=v; } out[y*w+x]=m; }
  return out;
}
function dilate(m, w, h, r){
  const out = new Uint8Array(m.length);
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){ if (!m[y*w+x]) continue;
    for (let dy=-r;dy<=r;dy++) for (let dx=-r;dx<=r;dx++){ const xx=x+dx, yy=y+dy; if (xx>=0&&yy>=0&&xx<w&&yy<h) out[yy*w+xx]=1; } }
  return out;
}
// 穴埋め（push-pull）：色と奥行きを周りから補う
function pushPull(rgba, d, mask, w, h){
  const levels = [];
  let Pv = new Float32Array(w*h*4), Wv = new Float32Array(w*h);
  for (let i=0;i<w*h;i++) if (!mask[i]){ Wv[i]=1; Pv[i*4]=rgba[i*4]; Pv[i*4+1]=rgba[i*4+1]; Pv[i*4+2]=rgba[i*4+2]; Pv[i*4+3]=d[i]; }
  levels.push({w,h,P:Pv,W:Wv});
  let cw=w, ch=h;
  while (cw>1 || ch>1){
    const nw=Math.max(1,Math.ceil(cw/2)), nh=Math.max(1,Math.ceil(ch/2));
    const L=levels[levels.length-1], nP=new Float32Array(nw*nh*4), nW=new Float32Array(nw*nh);
    for (let y=0;y<nh;y++) for (let x=0;x<nw;x++){
      let sw=0, s0=0,s1=0,s2=0,s3=0;
      for (let dy=0;dy<2;dy++) for (let dx=0;dx<2;dx++){ const sx=Math.min(cw-1,2*x+dx), sy=Math.min(ch-1,2*y+dy), j=sy*cw+sx;
        sw+=L.W[j]; s0+=L.P[j*4]; s1+=L.P[j*4+1]; s2+=L.P[j*4+2]; s3+=L.P[j*4+3]; }
      const i=y*nw+x;
      if (sw>0){ const a=Math.min(1,sw); nW[i]=a; nP[i*4]=s0/sw*a; nP[i*4+1]=s1/sw*a; nP[i*4+2]=s2/sw*a; nP[i*4+3]=s3/sw*a; }
    }
    levels.push({w:nw,h:nh,P:nP,W:nW}); cw=nw; ch=nh;
  }
  const top = levels[levels.length-1];
  if (top.W[0] < 1){ const a=top.W[0]; for (let k=0;k<4;k++) top.P[k] = a>0 ? top.P[k]/a : (k<3?200:0); top.W[0]=1; }
  for (let l=levels.length-2;l>=0;l--){
    const L=levels[l], Up=levels[l+1];
    for (let y=0;y<L.h;y++) for (let x=0;x<L.w;x++){
      const i=y*L.w+x, a=L.W[i]; if (a>=1) continue;
      const fx=Math.min(Up.w-1,Math.max(0,(x+0.5)/2-0.5)), fy=Math.min(Up.h-1,Math.max(0,(y+0.5)/2-0.5));
      const x0=Math.floor(fx), y0=Math.floor(fy), x1=Math.min(Up.w-1,x0+1), y1=Math.min(Up.h-1,y0+1), tx=fx-x0, ty=fy-y0;
      for (let k=0;k<4;k++){
        const v=(Up.P[(y0*Up.w+x0)*4+k]*(1-tx)+Up.P[(y0*Up.w+x1)*4+k]*tx)*(1-ty)+(Up.P[(y1*Up.w+x0)*4+k]*(1-tx)+Up.P[(y1*Up.w+x1)*4+k]*tx)*ty;
        L.P[i*4+k] = L.P[i*4+k] + v*(1-a);
      }
      L.W[i]=1;
    }
  }
  const out = new Uint8ClampedArray(w*h*4), od = new Float32Array(w*h);
  for (let i=0;i<w*h;i++){ out[i*4]=levels[0].P[i*4]; out[i*4+1]=levels[0].P[i*4+1]; out[i*4+2]=levels[0].P[i*4+2]; out[i*4+3]=255; od[i]=levels[0].P[i*4+3]; }
  return {rgba:out, d:od};
}

// ---------- 奥行き推定 ----------
function pseudoDepth(rgba, w, h){
  let hasAlpha = false;
  for (let i=3;i<rgba.length;i+=16) if (rgba[i] < 250){ hasAlpha = true; break; }
  const fg = new Float32Array(w*h);
  if (hasAlpha){ for (let i=0;i<w*h;i++) fg[i] = rgba[i*4+3]/255; }
  else {
    let r=0,g=0,b=0,n=0;
    const add = i => { r+=rgba[i*4]; g+=rgba[i*4+1]; b+=rgba[i*4+2]; n++; };
    for (let x=0;x<w;x++){ add(x); add((h-1)*w+x); } for (let y=0;y<h;y++){ add(y*w); add(y*w+w-1); }
    r/=n; g/=n; b/=n;
    for (let i=0;i<w*h;i++){ const dr=rgba[i*4]-r, dg=rgba[i*4+1]-g, db=rgba[i*4+2]-b;
      fg[i] = Math.min(1, Math.sqrt(dr*dr+dg*dg+db*db)/90); }
  }
  const fb = boxBlur(boxBlur(fg,w,h,4),w,h,4), d = new Float32Array(w*h);
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){ const i=y*w+x; d[i] = 0.3*(y/(h-1)) + 0.7*Math.min(1, fb[i]*1.3); }
  return normalize(d);
}
// ---------- AI（奥行き・切り抜き） ----------
let TF = null, depthPipe = null, rmbg = null;
const DEVICE = navigator.gpu ? 'webgpu' : 'wasm';
async function getT(){ if (!TF){ TF = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.6'); TF.env.allowLocalModels = false; } return TF; }
function progCb(onProg){ const files = {}; return e => {
  if (e.status === 'progress' && e.total){ files[e.file] = [e.loaded, e.total]; let l=0,t=0; for (const k in files){ l+=files[k][0]; t+=files[k][1]; } onProg(Math.round(l/t*100)); } }; }
async function withDevice(fn){ try { return await fn(DEVICE); } catch(e){ if (DEVICE === 'wasm') throw e; return await fn('wasm'); } }
async function blobURL(cv){ const b = await new Promise(r => cv.toBlob(r, 'image/png')); return URL.createObjectURL(b); }
async function aiDepth(cv, onProg){
  const T = await getT();
  if (!depthPipe) depthPipe = await withDevice(dev => T.pipeline('depth-estimation', 'onnx-community/depth-anything-v2-small', {device:dev, progress_callback:progCb(onProg)}));
  const url = await blobURL(cv);
  try { const out = await depthPipe(url), di = out.depth;
    return normalize(resample(di.data, di.width, di.height, di.channels || 1, cv.width, cv.height)); }
  finally { URL.revokeObjectURL(url); }
}
async function aiMask(cv, onProg){
  const T = await getT();
  if (!rmbg){
    const model = await withDevice(dev => T.AutoModel.from_pretrained('briaai/RMBG-1.4', {config:{model_type:'custom'}, device:dev, progress_callback:progCb(onProg)}));
    const processor = await T.AutoProcessor.from_pretrained('briaai/RMBG-1.4', {config:{
      do_normalize:true, do_pad:false, do_rescale:true, do_resize:true, image_mean:[0.5,0.5,0.5], feature_extractor_type:'ImageFeatureExtractor',
      image_std:[1,1,1], resample:2, rescale_factor:0.00392156862745098, size:{width:1024, height:1024}}});
    rmbg = {model, processor};
  }
  const url = await blobURL(cv);
  try {
    const img = await T.RawImage.fromURL(url);
    const {pixel_values} = await rmbg.processor(img);
    const {output} = await rmbg.model({input:pixel_values});
    const m = await T.RawImage.fromTensor(output[0].mul(255).to('uint8')).resize(img.width, img.height);
    return {data:m.data, w:m.width, h:m.height, ch:m.channels || 1};
  } finally { URL.revokeObjectURL(url); }
}

// ---------- 解析：床と壁、キャラの切り出し ----------
function fitFold(d, fg, w, h){
  const row = new Float32Array(h), ok = new Uint8Array(h), buf = [];
  for (let y=0;y<h;y++){ buf.length = 0;
    for (let x=0;x<w;x++){ const i=y*w+x; if (!fg || fg[i] < 0.5) buf.push(d[i]); }
    if (buf.length > w*0.05){ buf.sort((a,b)=>a-b); row[y] = buf[Math.floor(buf.length*0.3)]; ok[y]=1; } }
  let lastV = null; for (let y=0;y<h;y++){ if (ok[y]) lastV = row[y]; else if (lastV!=null) row[y] = lastV; }
  let firstV = null; for (let y=h-1;y>=0;y--){ if (ok[y]) firstV = row[y]; else if (!ok[y] && lastV==null) row[y] = firstV ?? 0.3; }
  let best = {err:1e18, yf:h-1, c:0, e:0};
  for (let yf=Math.floor(h*0.15); yf<h-2; yf++){
    let c=0; for (let y=0;y<=yf;y++) c+=row[y]; c/=(yf+1);
    let num=0, den=0; for (let y=yf+1;y<h;y++){ const t=(y-yf)/(h-1-yf); num+=t*(row[y]-c); den+=t*t; }
    const slope = Math.max(0, num/den);
    let err=0; for (let y=0;y<=yf;y++){ const r=row[y]-c; err+=r*r; }
    for (let y=yf+1;y<h;y++){ const t=(y-yf)/(h-1-yf), r=row[y]-c-slope*t; err+=r*r; }
    if (err < best.err) best = {err, yf, c, e:c+slope};
  }
  const vf = best.yf/(h-1);
  return {vf, c:best.c, e:best.e, at: v => v<=vf ? best.c : best.c + (best.e-best.c)*Math.min(1.3,(v-vf)/Math.max(1e-3,1-vf))};
}
function boxErode(m, w, h, r){
  if (r<=0) return m.slice();
  const tmp = new Uint8Array(w*h), out = new Uint8Array(w*h);
  for (let y=0;y<h;y++){ let run=0; const pre=new Int32Array(w+1); for (let x=0;x<w;x++) pre[x+1]=pre[x]+m[y*w+x];
    for (let x=0;x<w;x++){ const a=Math.max(0,x-r), b=Math.min(w-1,x+r); tmp[y*w+x] = (pre[b+1]-pre[a]) === (b-a+1) ? 1 : 0; } }
  for (let x=0;x<w;x++){ const pre=new Int32Array(h+1); for (let y=0;y<h;y++) pre[y+1]=pre[y]+tmp[y*w+x];
    for (let y=0;y<h;y++){ const a=Math.max(0,y-r), b=Math.min(h-1,y+r); out[y*w+x] = (pre[b+1]-pre[a]) === (b-a+1) ? 1 : 0; } }
  return out;
}
function components(m, w, h, minArea){
  const lab = new Int32Array(w*h).fill(-1), q = new Int32Array(w*h); let n = 0;
  for (let s=0;s<w*h;s++){ if (!m[s] || lab[s]>=0) continue;
    let qh=0, qt=0; q[qt++]=s; lab[s]=n; let area=0;
    while (qh<qt){ const i=q[qh++]; area++; const x=i%w, y=(i/w)|0;
      if (x>0 && m[i-1] && lab[i-1]<0){ lab[i-1]=n; q[qt++]=i-1; } if (x<w-1 && m[i+1] && lab[i+1]<0){ lab[i+1]=n; q[qt++]=i+1; }
      if (y>0 && m[i-w] && lab[i-w]<0){ lab[i-w]=n; q[qt++]=i-w; } if (y<h-1 && m[i+w] && lab[i+w]<0){ lab[i+w]=n; q[qt++]=i+w; } }
    if (area < minArea){ for (let k=0;k<qt;k++) lab[q[k]] = -1; } else n++;
  }
  return {lab, n};
}
function growLabels(lab, m, w, h){
  const q = new Int32Array(w*h); let qh=0, qt=0;
  for (let i=0;i<w*h;i++) if (lab[i]>=0) q[qt++]=i;
  while (qh<qt){ const i=q[qh++], x=i%w, y=(i/w)|0, L=lab[i];
    const tryP = j => { if (m[j] && lab[j]<0){ lab[j]=L; q[qt++]=j; } };
    if (x>0) tryP(i-1); if (x<w-1) tryP(i+1); if (y>0) tryP(i-w); if (y<h-1) tryP(i+w); }
  return lab;
}
function alphaCanvas(a, w, h, ch){ // a: 0..255 アルファ
  const px = new Uint8ClampedArray(w*h*4); for (let i=0;i<w*h;i++){ px[i*4]=px[i*4+1]=px[i*4+2]=255; px[i*4+3]=a[i*(ch||1)]; }
  const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').putImageData(new ImageData(px,w,h),0,0); return c;
}

// 解析結果（毎回は作り直さない）
function analyzeFold(){
  const {w,h,d} = work;
  work.fold = fitFold(d, work.fgW, w, h);
  if (!work.fgW){ // 切り抜きAIが使えないときは「床と壁より手前にあるもの」をキャラとみなす
    const f = new Float32Array(w*h);
    for (let y=0;y<h;y++){ const base = work.fold.at(y/(h-1)); for (let x=0;x<w;x++){ const i=y*w+x; f[i] = d[i]-base > 0.2 ? 1 : 0; } }
    work.fgW = boxBlur(f, w, h, 1);
    work.fgFullCanvas = null;
    work.fold = fitFold(d, work.fgW, w, h);
  }
}
function makeAssets(){
  const {w, h, d, full, fgW, fold} = work, FW = full.width, FH = full.height, sx = FW/w, sy = FH/h;
  const mask = new Uint8Array(w*h); for (let i=0;i<w*h;i++) mask[i] = fgW[i] > 0.5 ? 1 : 0;
  const er = boxErode(mask, w, h, Math.round(P.split));
  const comp = components(er, w, h, Math.round(w*h*0.002));
  const lab = growLabels(comp.lab, mask, w, h);
  const fgAlpha = work.fgFullCanvas || (() => { const a=new Uint8Array(w*h); for (let i=0;i<w*h;i++) a[i]=Math.round(fgW[i]*255); return alphaCanvas(a,w,h,1); })();
  const rim = Math.round(P.rim);
  const out = [];
  for (let k=0;k<comp.n;k++){
    let x0=w, y0=h, x1=-1, y1=-1, area=0; const rows = new Int32Array(h), ds = [];
    const mk = new Uint8Array(w*h);
    for (let i=0;i<w*h;i++) if (lab[i]===k){ mk[i]=1; const x=i%w, y=(i/w)|0; area++; rows[y]++; ds.push(d[i]);
      if (x<x0)x0=x; if (x>x1)x1=x; if (y<y0)y0=y; if (y>y1)y1=y; }
    if (area < w*h*0.003) continue;
    let acc=0, foot=y1; for (let y=y1;y>=0;y--){ acc+=rows[y]; if (acc > area*0.02){ foot=y; break; } }
    let fx0=w, fx1=-1; for (let y=Math.max(0,foot-Math.round(h*0.04)); y<=y1; y++) for (let x=x0;x<=x1;x++) if (mk[y*w+x]){ if (x<fx0)fx0=x; if (x>fx1)fx1=x; }
    ds.sort((a,b)=>a-b);
    const pad = rim + 2;
    const bx0=Math.max(0,x0-pad), by0=Math.max(0,y0-pad), bx1=Math.min(w-1,x1+pad), by1=Math.min(h-1,y1+pad);
    const cx0=Math.floor(bx0*sx), cy0=Math.floor(by0*sy), cw=Math.max(2,Math.ceil((bx1+1)*sx)-cx0), ch=Math.max(2,Math.ceil((by1+1)*sy)-cy0);
    const c = document.createElement('canvas'); c.width=cw; c.height=ch; const g=c.getContext('2d');
    g.imageSmoothingQuality = 'high';
    g.drawImage(full, -cx0, -cy0);
    g.globalCompositeOperation = 'destination-in';
    g.drawImage(fgAlpha, -cx0, -cy0, FW, FH);
    const own = boxDilate(mk, w, h, 1);
    g.drawImage(alphaCanvas(own.map(v=>v*255), w, h, 1), -cx0, -cy0, FW, FH);
    if (rim>0){ g.globalCompositeOperation = 'destination-over'; g.fillStyle='#fff';
      const rimM = dilate(mk, w, h, rim); g.drawImage(alphaCanvas(rimM.map(v=>v*255), w, h, 1), -cx0, -cy0, FW, FH); }
    g.globalCompositeOperation = 'source-over';
    const vFoot = foot/(h-1), onFloor = vFoot > fold.vf + 0.02;
    out.push({canvas:c, u0:cx0/FW, v0:cy0/FH, u1:(cx0+cw)/FW, v1:(cy0+ch)/FH, vFoot, onFloor,
      dMed: ds[Math.floor(ds.length*0.5)], footU0:fx0/(w-1), footU1:fx1/(w-1)});
  }
  // 背景（キャラを抜いた床と壁）
  const hole = dilate(mask, w, h, 2);
  const bg = document.createElement('canvas'); bg.width=FW; bg.height=FH; const g=bg.getContext('2d');
  if (P.fill === 'blur') g.drawImage(rgbaCanvas(pushPull(work.rgba, new Float32Array(w*h), hole, w, h).rgba, w, h), 0, 0, FW, FH);
  else g.drawImage(paperCanvas(FW, FH), 0, 0);
  const A = document.createElement('canvas'); A.width=FW; A.height=FH; const ga=A.getContext('2d');
  ga.drawImage(full,0,0); ga.globalCompositeOperation='destination-out';
  ga.drawImage(alphaCanvas(hole.map(v=>v*255), w, h, 1), 0, 0, FW, FH); ga.drawImage(fgAlpha, 0, 0, FW, FH);
  g.drawImage(A, 0, 0);
  work.cardsData = out.sort((a,b) => a.dMed - b.dMed);
  work.bgCanvas = bg;
}
function boxDilate(m, w, h, r){
  const tmp = new Uint8Array(m.length), out = new Uint8Array(m.length);
  for (let y=0;y<h;y++){ const pre=new Int32Array(w+1); for (let x=0;x<w;x++) pre[x+1]=pre[x]+m[y*w+x];
    for (let x=0;x<w;x++){ const a=Math.max(0,x-r), b=Math.min(w-1,x+r); tmp[y*w+x] = pre[b+1]-pre[a] > 0 ? 1 : 0; } }
  for (let x=0;x<w;x++){ const pre=new Int32Array(h+1); for (let y=0;y<h;y++) pre[y+1]=pre[y]+tmp[y*w+x];
    for (let y=0;y<h;y++){ const a=Math.max(0,y-r), b=Math.min(h-1,y+r); out[y*w+x] = pre[b+1]-pre[a] > 0 ? 1 : 0; } }
  return out;
}
function rgbaCanvas(a, w, h){ const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').putImageData(new ImageData(a,w,h),0,0); return c; }

// ---------- 描画 ----------
const VS = `
uniform float zFixed; uniform float zMin; uniform float zMax; uniform float focus; uniform float blurAmt;
varying vec2 vUv; varying float vBlur;
void main(){
  vUv=uv;
  float z = zFixed > -50. ? zFixed : position.z;
  float zn = clamp((z-zMin)/max(zMax-zMin,1e-3),0.,1.);
  vBlur = abs(zn-focus)*blurAmt*22.;
  gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);
}`;
const FS = `
uniform sampler2D map; uniform vec2 texel; uniform float opacity; varying vec2 vUv; varying float vBlur;
void main(){
  vec4 acc=vec4(0.);
  if(vBlur<0.5){ vec4 c=texture2D(map,vUv); acc=vec4(c.rgb*c.a,c.a); }
  else { for(int i=0;i<16;i++){ float fi=float(i); float r=sqrt((fi+0.5)/16.)*vBlur; float a=fi*2.39996;
    vec4 c=texture2D(map,vUv+vec2(cos(a),sin(a))*r*texel); acc+=vec4(c.rgb*c.a,c.a); } acc/=16.; }
  if(acc.a<0.05) discard;
  gl_FragColor=vec4(acc.rgb/max(acc.a,1e-4), acc.a*opacity);
}`;
const shared = {zMin:{value:-0.3}, zMax:{value:0.3}, focus:{value:1}, blurAmt:{value:0}};
function sceneMat(tex, zFixed, transparent){
  return new THREE.ShaderMaterial({vertexShader:VS, fragmentShader:FS, transparent, depthWrite:true, side:THREE.DoubleSide,
    uniforms:{map:{value:tex}, texel:{value:new THREE.Vector2(1/tex.image.width, 1/tex.image.height)}, opacity:{value:1}, zFixed:{value:zFixed},
      zMin:shared.zMin, zMax:shared.zMax, focus:shared.focus, blurAmt:shared.blurAmt}});
}
function mkTex(c){ const t=new THREE.CanvasTexture(c); t.minFilter=THREE.LinearFilter; t.generateMipmaps=false; t.anisotropy=4; return t; }
const shadowTex = (() => { const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,'rgba(0,0,0,.55)'); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr; g.fillRect(0,0,64,64); return new THREE.CanvasTexture(c); })();

const sceneZ = {lo:-0.3, hi:0.3};
let cards = [], bgMesh = null, bgTex = null;
const dToZ = d => (d - 0.5) * P.depth;
const DISTV = () => DIST/ZOOM;
function proj(u, v, z){ const s = (DISTV() - z)/DISTV(); return new THREE.Vector3((u-0.5)*aspect*s, (0.5-v)*s, z); }

function disposeScene(){
  cards.forEach(c => { group.remove(c.pivot); c.mesh.geometry.dispose(); c.mesh.material.dispose(); c.tex.dispose();
    if (c.shadow){ group.remove(c.shadow); c.shadow.geometry.dispose(); c.shadow.material.dispose(); } });
  cards = [];
  if (bgMesh){ group.remove(bgMesh); bgMesh.geometry.dispose(); bgMesh.material.dispose(); bgMesh = null; }
  if (bgTex){ bgTex.dispose(); bgTex = null; }
}
function buildScene(){
  if (!work || !work.cardsData) return;
  disposeScene();
  const fold = work.fold, ext = 0.15;
  // 背景：壁（奥に立つ）と床（手前に寝る）の折れ曲がった1枚
  const vs = [];
  const steps = 160; for (let i=0;i<=steps;i++) vs.push(-ext + (1+2*ext)*i/steps);
  vs.push(fold.vf); vs.sort((a,b)=>a-b);
  const us = [-ext, 0.5, 1+ext];
  const pos = [], uv = [], idx = [];
  vs.forEach(v => us.forEach(u => { const z = dToZ(fold.at(Math.min(1.25, Math.max(0, v)))); const p = proj(u, v, z); pos.push(p.x, p.y, p.z); uv.push(u, 1-v); }));
  for (let r=0;r<vs.length-1;r++) for (let c=0;c<us.length-1;c++){ const a=r*us.length+c, b=a+1, d=a+us.length, e=d+1; idx.push(a,d,b, b,d,e); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2)); g.setIndex(idx);
  bgTex = mkTex(work.bgCanvas);
  bgMesh = new THREE.Mesh(g, sceneMat(bgTex, -100, false)); group.add(bgMesh);
  const zWall = dToZ(fold.c);
  let zHi = dToZ(fold.at(1));
  // キャラのカード
  work.cardsData.forEach((cd, i) => {
    let z = cd.onFloor ? dToZ(fold.at(cd.vFoot)) : dToZ(cd.dMed);
    z = Math.max(z, zWall + 0.02*P.depth) + 0.004;
    zHi = Math.max(zHi, z);
    const pivotV = cd.onFloor ? cd.vFoot : cd.v1;
    const pv = proj(0.5, pivotV, z);
    const corners = [[cd.u0,cd.v0],[cd.u1,cd.v0],[cd.u0,cd.v1],[cd.u1,cd.v1]].map(([u,v]) => proj(u, v, z));
    const cg = new THREE.BufferGeometry();
    cg.setAttribute('position', new THREE.Float32BufferAttribute(corners.flatMap(p => [p.x, p.y-pv.y, 0]), 3));
    cg.setAttribute('uv', new THREE.Float32BufferAttribute([0,1, 1,1, 0,0, 1,0], 2));
    cg.setIndex([0,2,1, 1,2,3]);
    const tex = mkTex(cd.canvas);
    const mesh = new THREE.Mesh(cg, sceneMat(tex, z, true));
    const pivot = new THREE.Group(); pivot.position.set(0, pv.y, z); pivot.add(mesh); group.add(pivot);
    let shadow = null;
    if (cd.onFloor){
      const uc = (cd.footU0+cd.footU1)/2, hw = Math.max(0.03, (cd.footU1-cd.footU0)/2*1.15);
      const fz = v => dToZ(fold.at(v));
      const P0 = proj(uc, cd.vFoot, fz(cd.vFoot)), Pf = proj(uc, cd.vFoot-0.03, fz(cd.vFoot-0.03)), Pn = proj(uc, cd.vFoot+0.03, fz(cd.vFoot+0.03));
      const T = Pf.clone().sub(Pn).normalize().multiplyScalar(0.035), X = proj(uc+hw, cd.vFoot, fz(cd.vFoot)).sub(P0);
      const q = [P0.clone().sub(X).add(T), P0.clone().add(X).add(T), P0.clone().sub(X).sub(T), P0.clone().add(X).sub(T)];
      const sg = new THREE.BufferGeometry();
      sg.setAttribute('position', new THREE.Float32BufferAttribute(q.flatMap(p => [p.x, p.y, p.z+0.002]), 3));
      sg.setAttribute('uv', new THREE.Float32BufferAttribute([0,1, 1,1, 0,0, 1,0], 2)); sg.setIndex([0,2,1, 1,2,3]);
      shadow = new THREE.Mesh(sg, new THREE.MeshBasicMaterial({map:shadowTex, transparent:true, depthWrite:false, side:THREE.DoubleSide}));
      shadow.renderOrder = 1; group.add(shadow);
    }
    cards.push({pivot, mesh, shadow, tex, z, order:i, count:work.cardsData.length});
  });
  cards.sort((a,b) => a.z - b.z).forEach((c,i) => { c.mesh.renderOrder = 2+i; c.rank = i; });
  sceneZ.lo = zWall; sceneZ.hi = zHi;
  shared.zMin.value = zWall; shared.zMax.value = zHi;
  applyBlur(); buildParticles();
}
function applyBlur(){ shared.focus.value = P.focus; shared.blurAmt.value = P.blur; }

// 開くアニメ
const OPEN_MS = 2400;
let openStart = -1e9;
function easeOutBack(t){ const c1=1.4, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); }
function openT(rank, n, now){
  const p = (now - openStart)/OPEN_MS, span = 0.5, delay = n>1 ? rank/(n-1)*(1-span) : 0;
  return Math.min(1, Math.max(0, (p - delay)/span));
}
// ---------- パーティクル ----------
function spriteTex(kind){
  const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d');
  if (kind==='sakura'){ g.fillStyle='#ffc6d6'; g.beginPath(); g.ellipse(32,32,14,24,0.5,0,7); g.fill(); g.fillStyle='#ff9fbb'; g.beginPath(); g.ellipse(32,32,5,14,0.5,0,7); g.fill(); }
  else if (kind==='snow'){ const gr=g.createRadialGradient(32,32,0,32,32,30); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.5,'rgba(255,255,255,.8)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,64,64); }
  else if (kind==='kira'){ const gr=g.createRadialGradient(32,32,0,32,32,12); gr.addColorStop(0,'rgba(255,255,230,1)'); gr.addColorStop(1,'rgba(255,240,180,0)'); g.fillStyle=gr; g.fillRect(0,0,64,64);
    g.fillStyle='rgba(255,250,220,.95)'; g.beginPath(); g.moveTo(32,2); g.lineTo(35,29); g.lineTo(62,32); g.lineTo(35,35); g.lineTo(32,62); g.lineTo(29,35); g.lineTo(2,32); g.lineTo(29,29); g.fill(); }
  else { g.fillStyle='#fff'; g.fillRect(20,12,24,40); }
  const t=new THREE.CanvasTexture(c); return t;
}
let particles = null;
function buildParticles(){
  if (particles){ group.remove(particles.points); particles.points.geometry.dispose(); particles.points.material.map.dispose(); particles.points.material.dispose(); particles = null; }
  if (P.particle === 'none') return;
  const n = Math.round(P.amount), pos = new Float32Array(n*3), col = new Float32Array(n*3), meta = [];
  const pal = [[1,.42,.5],[1,.82,.4],[.45,.75,1],[.6,.9,.55],[1,1,1],[.85,.6,1]];
  for (let i=0;i<n;i++){
    meta.push({ph:Math.random()*6.28, sp:0.5+Math.random(), sx:0.3+Math.random()*0.7});
    resetP(pos, i, true);
    const cc = P.particle==='confetti' ? pal[i%pal.length] : [1,1,1]; col.set(cc, i*3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  const size = {sakura:0.045, snow:0.03, kira:0.06, confetti:0.035}[P.particle];
  const m = new THREE.PointsMaterial({map:spriteTex(P.particle), size, sizeAttenuation:true, transparent:true, depthWrite:false, vertexColors:true, alphaTest:0.02,
    blending: P.particle==='kira' ? THREE.AdditiveBlending : THREE.NormalBlending});
  const points = new THREE.Points(g, m); points.renderOrder = 1000; points.frustumCulled = false;
  group.add(points);
  particles = {points, meta, n};
}
function resetP(pos, i, anyY){
  const zl = sceneZ.lo, zh = sceneZ.hi + 0.12;
  pos[i*3] = (Math.random()-0.5)*aspect*1.3;
  pos[i*3+1] = anyY ? Math.random()*1.3-0.65 : (P.particle==='kira' ? -0.65 : 0.65);
  pos[i*3+2] = zl + Math.random()*(zh-zl);
}
function stepParticles(dt, t){
  if (!particles) return;
  const pos = particles.points.geometry.attributes.position.array, k = P.particle;
  for (let i=0;i<particles.n;i++){
    const m = particles.meta[i];
    if (k==='kira'){ pos[i*3+1] += dt*0.04*m.sp; pos[i*3] += Math.sin(t*0.7+m.ph)*dt*0.01; if (pos[i*3+1]>0.65) resetP(pos,i,false); }
    else { const v = k==='snow' ? 0.06 : 0.1;
      pos[i*3+1] -= dt*v*m.sp; pos[i*3] += Math.sin(t*1.3*m.sx+m.ph)*dt*0.06 + dt*(k==='sakura'?0.03:0);
      if (pos[i*3+1] < -0.65) resetP(pos,i,false); }
  }
  particles.points.geometry.attributes.position.needsUpdate = true;
}

// ---------- 読み込み ----------
async function load(src, name, presetDepthCanvas){
  const token = ++loadToken;
  title = name;
  const full = scaledCanvas(src, FULL, true), wc = scaledCanvas(src, WORK, true);
  aspect = full.width / full.height;
  const w = wc.width, h = wc.height, rgba = wc.getContext('2d').getImageData(0,0,w,h).data;
  layout();
  const finish = (msg, warn) => { analyzeFold(); makeAssets(); buildScene(); openStart = performance.now(); status(msg, warn); };
  if (presetDepthCanvas){
    const dc = scaledCanvas(presetDepthCanvas, WORK, true), dd = dc.getContext('2d').getImageData(0,0,dc.width,dc.height).data;
    work = {w, h, rgba, full, d: normalize(resample(dd, dc.width, dc.height, 4, w, h)), fgW:null};
    finish('見本は奥行きデータ付きです。自分の画像はAIで奥行きと切り抜きを推定します。');
    return;
  }
  disposeScene();
  work = {w, h, rgba, full, d:null, fgW:null};
  status('AIで奥行きを推定しています…');
  try {
    const d = await aiDepth(wc, p => { if (token===loadToken) status(`奥行きAIを読み込み中… ${p}%（初回のみ）`); });
    if (token !== loadToken) return;
    work.d = boxBlur(d, w, h, 1);
  } catch (e) {
    console.warn(e); if (token !== loadToken) return;
    work.d = pseudoDepth(scaledCanvas(src, WORK, false).getContext('2d').getImageData(0,0,w,h).data, w, h);
    finish('この環境ではAIを使えないので、簡易の奥行きで表示しています。GitHub Pages などに置くとAIが使えます。', true);
    return;
  }
  status('AIでキャラを切り抜いています…');
  try {
    const m = await aiMask(full, p => { if (token===loadToken) status(`切り抜きAIを読み込み中… ${p}%（初回のみ）`); });
    if (token !== loadToken) return;
    const fw = new Float32Array(w*h), r = resample(m.data, m.w, m.h, m.ch, w, h);
    for (let i=0;i<w*h;i++) fw[i] = r[i]/255;
    work.fgW = fw;
    const a = new Uint8Array(m.w*m.h); for (let i=0;i<a.length;i++) a[i] = m.data[i*m.ch];
    work.fgFullCanvas = alphaCanvas(a, m.w, m.h, 1);
    finish('AIの奥行きと切り抜きで表示中');
  } catch (e) {
    console.warn(e); if (token !== loadToken) return;
    finish('切り抜きAIが使えなかったので、奥行きだけでキャラを切り分けています。', true);
  }
}
function loadFile(file){
  if (!file || !file.type.startsWith('image/')){ toast('画像ファイルをえらんでください'); return; }
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => { load(img, file.name.replace(/\.[^.]+$/,'') || '無題'); URL.revokeObjectURL(url); };
  img.onerror = () => toast('この画像は読み込めませんでした');
  img.src = url;
}
$('#file').addEventListener('change', e => loadFile(e.target.files[0]));
['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); win.classList.add('dragover'); }));
['dragleave','drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); win.classList.remove('dragover'); }));
document.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));

// ---------- 表示サイズ ----------
let recording = null;
function layout(){ win.style.width = `min(100%, calc(min(70vh, 780px) * ${aspect}))`; win.style.aspectRatio = `${aspect}`; resize(); }
function resize(){
  if (recording) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(2, Math.round(win.clientWidth*dpr)), h = Math.max(2, Math.round(win.clientWidth/aspect*dpr));
  renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(win);

// ---------- 視点 ----------
let yaw=0, pitch=0, tyaw=0, tpitch=0, manualUntil=0, gyroOn=false;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function onPoint(e){
  const r = canvas.getBoundingClientRect();
  tyaw = clamp(((e.clientX-r.left)/r.width)*2-1, -1, 1); tpitch = clamp(-(((e.clientY-r.top)/r.height)*2-1), -1, 1);
  manualUntil = performance.now() + 2500;
}
canvas.addEventListener('pointermove', e => { if (e.pointerType==='mouse' || e.buttons) onPoint(e); });
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); onPoint(e); });
const gyroBtn = $('#gyro');
if ('DeviceOrientationEvent' in window && matchMedia('(pointer:coarse)').matches) gyroBtn.hidden = false;
gyroBtn.addEventListener('click', async () => {
  try {
    if (typeof DeviceOrientationEvent.requestPermission === 'function'){
      if (await DeviceOrientationEvent.requestPermission() !== 'granted'){ toast('傾きセンサーが使えませんでした'); return; } }
    if (!gyroOn){
      window.addEventListener('deviceorientation', e => { if (e.gamma == null) return;
        tyaw = clamp(e.gamma/25, -1, 1); tpitch = clamp(-(e.beta-45)/25, -1, 1); manualUntil = performance.now() + 2500; });
      gyroOn = true; toast('スマホを傾けてみてください');
    }
  } catch { toast('傾きセンサーが使えませんでした'); }
});
const autoEl = $('#auto');
if (matchMedia('(prefers-reduced-motion: reduce)').matches) autoEl.checked = false;
function setCamera(){
  const A = THREE.MathUtils.degToRad(P.angle), y = yaw*A, p = pitch*A*0.7, dist = DISTV();
  camera.position.set(dist*Math.sin(y)*Math.cos(p), dist*Math.sin(p), dist*Math.cos(y)*Math.cos(p));
  camera.lookAt(0,0,0);
}
const smooth = (a,b,x) => { const t = clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  if (recording){
    const el = now - recording.start, u = Math.min(1, el/recording.ms);
    if (recording.mode === 'sway'){ yaw = Math.sin(u*Math.PI*2)*0.9; pitch = Math.sin(u*Math.PI*4)*0.4; }
    else { const r = smooth(0.3, 1, el/OPEN_MS); yaw = Math.sin((el-OPEN_MS*0.6)/1000*1.1)*0.7*r; pitch = 0.8 - 0.55*r; }
    if (u >= 1 && recording.rec.state === 'recording') recording.rec.stop();
  } else {
    if (autoEl.checked && now > manualUntil){ const t=now*0.001; tyaw=Math.sin(t*0.6)*0.8; tpitch=Math.sin(t*1.2)*0.35; }
    yaw += (tyaw-yaw)*0.12; pitch += (tpitch-pitch)*0.12;
  }
  cards.forEach(c => { const t = openT(c.rank, c.count, now);
    c.pivot.rotation.x = -Math.PI/2 * (1 - easeOutBack(t));
    if (c.shadow) c.shadow.material.opacity = t; });
  stepParticles(dt, now/1000);
  setCamera();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- 操作パネル ----------
const bind = (id, out, key, fmt, after) => {
  const el = $(id), o = $(out), show = () => o.textContent = fmt(P[key]);
  P[key] = parseFloat(el.value); show();
  el.addEventListener('input', () => { P[key] = parseFloat(el.value); show(); after && after(); });
};
let rbTimer; const later = fn => () => { clearTimeout(rbTimer); rbTimer = setTimeout(fn, 150); };
const remake = () => { if (work && work.fold){ makeAssets(); buildScene(); } };
bind('#pDepth', '#oDepth', 'depth', v => v.toFixed(2), later(buildScene));
bind('#pAngle', '#oAngle', 'angle', v => `±${v}°`);
bind('#pRim', '#oRim', 'rim', v => v ? `${v}` : 'なし', later(remake));
bind('#pSplit', '#oSplit', 'split', v => v ? `${v}` : 'しない', later(remake));
bind('#pBlur', '#oBlur', 'blur', v => v ? v.toFixed(2) : 'なし', applyBlur);
bind('#pFocus', '#oFocus', 'focus', v => v.toFixed(2), applyBlur);
bind('#pAmount', '#oAmount', 'amount', v => `${v}`, later(buildParticles));
$('#reopen').addEventListener('click', () => { openStart = performance.now(); });
const segPick = (box, attr, fn) => box.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
  box.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x===b)); fn(b.dataset[attr]); }));
segPick($('#pSeg'), 'p', v => { P.particle = v; buildParticles(); });
segPick($('#fSeg'), 'f', v => { P.fill = v; remake(); });
let vmode = 'open', sec = 5;
segPick($('#mSeg'), 'm', v => vmode = v);
segPick($('#lSeg'), 'sec', v => sec = +v);

// ---------- 動画書き出し ----------
const inViewer = !!(window.claude && typeof window.claude.use === 'function');
const dlPromise = inViewer ? window.claude.use('downloads').catch(() => null) : null;
async function saveFile(name, blob){
  if (dlPromise){
    const dl = await dlPromise;
    if (!dl){ toast('このページでは保存できません'); return; }
    try { await dl.save({filename:name, data:blob}); toast('保存しました'); }
    catch(e){ if (e && e.code !== 'declined') toast('保存できませんでした'); }
  } else {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('保存しました');
  }
}
$('#recBtn').addEventListener('click', () => {
  if (recording || !bgMesh) return;
  if (!window.MediaRecorder || !canvas.captureStream){ toast('このブラウザは動画の書き出しに対応していません'); return; }
  const type = ['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].find(t => MediaRecorder.isTypeSupported(t));
  if (!type){ toast('このブラウザは動画の書き出しに対応していません'); return; }
  const ext = type.startsWith('video/mp4') ? 'mp4' : 'webm';
  const L = 1080, ew = aspect>=1 ? L : Math.round(L*aspect/2)*2, eh = aspect>=1 ? Math.round(L/aspect/2)*2 : L;
  renderer.setSize(ew, eh, false); camera.aspect = ew/eh; camera.updateProjectionMatrix();
  const stream = canvas.captureStream(30);
  const rec = new MediaRecorder(stream, {mimeType:type, videoBitsPerSecond:10_000_000});
  const chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    recording = null; $('#rec').hidden = true; $('#recBtn').disabled = false; $('#recBtn').textContent = '動画を書き出す';
    resize();
    const blob = new Blob(chunks, {type});
    if (!blob.size){ toast('動画を書き出せませんでした'); return; }
    await saveFile(`${title}_とびだすえほん.${ext}`, blob);
  };
  const now = performance.now();
  if (vmode === 'open') openStart = now;
  recording = {rec, start: now, ms: Math.max(sec*1000, vmode==='open' ? OPEN_MS+1000 : 0), mode: vmode};
  $('#rec').hidden = false; $('#recBtn').disabled = true; $('#recBtn').textContent = '録画中…';
  rec.start(200);
});
// ---------- 見本 ----------
function sample(){
  const W=1000, H=750;
  const mk = () => { const c=document.createElement('canvas'); c.width=W; c.height=H; return c; };
  const col = mk(), dep = mk();
  const draw = (g, D) => {
    const grey = v => { const n=Math.round(v*255); return `rgb(${n},${n},${n})`; };
    const fill = (c, v) => g.fillStyle = D ? grey(v) : c;
    let gr;
    if (D){ g.fillStyle='#000'; } else { gr=g.createLinearGradient(0,0,0,500); gr.addColorStop(0,'#86c3f2'); gr.addColorStop(1,'#ffe4c2'); g.fillStyle=gr; }
    g.fillRect(0,0,W,H);
    fill('#fff4b8',0.02); g.beginPath(); g.arc(800,150,60,0,7); g.fill();
    fill('#ffffff',0.06); [[180,120,50],[240,110,60],[300,125,45]].forEach(([x,y,r])=>{ g.beginPath(); g.arc(x,y,r,0,7); g.fill(); });
    fill('#7d97c4',0.16); g.beginPath(); g.moveTo(0,420); g.lineTo(160,250); g.lineTo(330,400); g.lineTo(520,230); g.lineTo(740,410); g.lineTo(880,300); g.lineTo(1000,380); g.lineTo(1000,750); g.lineTo(0,750); g.fill();
    fill('#93c47d',0.32); g.beginPath(); g.moveTo(0,470); for (let x=0;x<=1000;x+=20) g.lineTo(x, 470+Math.sin(x*0.008)*30); g.lineTo(1000,750); g.lineTo(0,750); g.fill();
    fill('#7a5234',0.5); g.fillRect(150,330,30,190);
    if (D){ gr=g.createRadialGradient(165,300,10,165,300,110); gr.addColorStop(0,grey(0.6)); gr.addColorStop(1,grey(0.48)); g.fillStyle=gr; } else g.fillStyle='#4f8a4b';
    g.beginPath(); g.arc(165,300,110,0,7); g.fill();
    if (D){ gr=g.createLinearGradient(0,560,0,750); gr.addColorStop(0,grey(0.55)); gr.addColorStop(1,grey(0.75)); g.fillStyle=gr; } else g.fillStyle='#6fb05a';
    g.beginPath(); g.moveTo(0,580); for (let x=0;x<=1000;x+=20) g.lineTo(x, 575+Math.sin(x*0.012+1)*12); g.lineTo(1000,750); g.lineTo(0,750); g.fill();
    if (!D){ for (let i=0;i<70;i++){ const x=(i*137)%1000, y=600+((i*61)%140); g.fillStyle=['#ff6b81','#ffd166','#ffffff'][i%3]; g.beginPath(); g.arc(x,y,6,0,7); g.fill(); } }
    // まんまるキャラ
    if (D){ gr=g.createRadialGradient(560,430,20,560,470,170); gr.addColorStop(0,grey(1)); gr.addColorStop(1,grey(0.82)); g.fillStyle=gr; } else g.fillStyle='#fffaf2';
    g.beginPath(); g.ellipse(560,480,150,140,0,0,7); g.fill();
    if (!D){ g.lineWidth=7; g.strokeStyle='#3a3340'; g.stroke();
      g.fillStyle='#3a3340'; g.beginPath(); g.ellipse(510,465,14,20,0,0,7); g.ellipse(610,465,14,20,0,0,7); g.fill();
      g.fillStyle='#ffb3b3'; g.beginPath(); g.ellipse(475,510,22,12,0,0,7); g.ellipse(645,510,22,12,0,0,7); g.fill();
      g.strokeStyle='#3a3340'; g.lineWidth=6; g.beginPath(); g.arc(560,500,18,0.2,Math.PI-0.2); g.stroke(); }
    fill('#5fae4f',0.86); g.beginPath(); g.ellipse(590,330,22,48,0.7,0,7); g.fill();
  };
  draw(col.getContext('2d'), false); draw(dep.getContext('2d'), true);
  return {col, dep};
}
const s = sample();
load(s.col, 'まんまるの丘（見本）', s.dep);
})();
